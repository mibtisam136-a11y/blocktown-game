<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1020"><title>Blocktown</title></head><body>
<title>Blocktown Mayhem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D canvas, HUD pinned to safe-area corners, touch pads bottom-left / bottom-right, smartphone overlay centred */
:root{
  --ink:#10182b; --panel:rgba(12,20,38,.58); --panel-hi:rgba(12,20,38,.8); --card:#141c30; --card2:#1d2742;
  --cash:#46e07a; --alert:#ff5a4f; --sun:#ffd23f; --armor:#5aa9ff; --gps:#22d3ee; --paper:#ffffff;
  --ios-bg:#f2f2f7; --ios-ink:#111114; --ios-sub:#6b6b75; --ios-blue:#0a84ff; --ios-line:#e3e3e8;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#cockHud{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(10,15,35,.3) 100%)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(255,30,30,.55) 100%);opacity:0;transition:opacity .15s}
button{font-family:var(--display);color:var(--paper);border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.outl{text-shadow:0 2px 0 #0b1020,2px 0 0 #0b1020,-2px 0 0 #0b1020,0 -2px 0 #0b1020,0 3px 6px rgba(0,0,0,.4)}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#tl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);display:flex;gap:10px;align-items:flex-start}
#mini{width:132px;height:132px;border-radius:50%;border:4px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.35);background:#2aa8dc;pointer-events:auto;cursor:pointer}
#stats{display:flex;flex-direction:column;gap:5px;padding-top:4px}
#money{font-family:var(--display);font-size:28px;color:var(--cash);letter-spacing:.5px;font-variant-numeric:tabular-nums;line-height:1}
.bar{width:140px;height:12px;border-radius:7px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .2s}
#hpbar{background:linear-gradient(90deg,#ff5a4f,#ffb347 45%,#46e07a)}
#arbar{background:var(--armor)}
#armorWrap{height:8px}
#stars{font-size:22px;letter-spacing:1px;line-height:1;color:rgba(255,255,255,.25)}
#stars span{display:inline-block}
#stars span.on{color:var(--sun);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
#zone{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.9}
#rank{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1px}
#rank b{font-family:var(--display);font-weight:400;background:var(--sun);color:#0b1020;border-radius:8px;padding:1px 7px;font-size:13px;text-shadow:none;letter-spacing:0}
#xpbar{width:84px;height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.6)}#xpbar i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
#speedlines{position:fixed;inset:-25%;pointer-events:none;z-index:3;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,0) 0deg 4deg,rgba(255,255,255,.28) 4deg 4.5deg);-webkit-mask:radial-gradient(circle at center,transparent 34%,#000 62%);mask:radial-gradient(circle at center,transparent 34%,#000 62%)}
#combo{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);left:50%;transform:translateX(-50%);font-family:var(--display);font-size:28px;color:var(--sun);opacity:0;transition:opacity .2s;white-space:nowrap;text-align:center;line-height:1}
#combo small{display:block;font-size:13px;color:var(--paper);letter-spacing:2px}
#combo.show{opacity:1}
#tip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 112px);left:50%;transform:translateX(-50%);max-width:min(440px,62vw);background:var(--panel-hi);border:2px solid var(--gps);border-radius:14px;padding:8px 14px;font-size:13px;font-weight:800;text-align:center;opacity:0;transition:opacity .3s}
#tip.show{opacity:1}
#tip b{color:var(--gps)}
#gps{font-size:12px;font-weight:800;color:var(--gps);max-width:170px}

#tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px;pointer-events:auto}
.hbtn{background:var(--panel);border:2px solid rgba(255,255,255,.7);border-radius:14px;padding:8px 12px;font-size:16px;min-width:64px}
.hbtn small{display:block;font-family:var(--body);font-size:10px;opacity:.8;letter-spacing:1px}
#speedo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);font-family:var(--display);font-size:34px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
#speedo small{display:block;font-size:12px;letter-spacing:2px;opacity:.85}
#mission{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--sun);border-radius:14px;padding:6px 14px;text-align:center;max-width:min(420px,60vw)}
#mission b{display:block;font-family:var(--display);font-weight:400;color:var(--sun);font-size:15px;letter-spacing:.5px}
#mission span{font-size:13px;font-weight:800}
#mission em{font-style:normal;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
#mission em.low{color:var(--alert)}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
#cross.hit:before,#cross.hit:after{background:var(--alert)}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;background:var(--panel);padding:6px 14px;border-radius:20px;white-space:nowrap;opacity:0;transition:opacity .2s}
#hint.show{opacity:1}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 150px);left:50%;transform:translateX(-50%);font-family:var(--display);font-size:24px;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,6px)}
#banner{position:fixed;left:0;right:0;top:32%;z-index:12;text-align:center;pointer-events:none;font-family:var(--display);font-size:clamp(40px,8vw,80px);line-height:1;opacity:0;transform:scale(.8);transition:opacity .3s,transform .3s}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-size:.4em;margin-top:8px;color:var(--paper)}
#banner.pass{color:var(--sun)}#banner.fail{color:var(--alert)}

#touch{position:fixed;inset:0;z-index:4;touch-action:none}
#joy{position:fixed;z-index:6;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pad{position:absolute;display:flex;gap:12px;align-items:flex-end;pointer-events:none}
.pad button{pointer-events:auto;touch-action:none;background:var(--panel);border:3px solid rgba(255,255,255,.75);border-radius:50%;font-size:17px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.pad button.down{background:var(--panel-hi);transform:scale(.94)}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
#footR,#carR,#heliR,#planeR{right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#carL{left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#bFire{width:92px;height:92px;font-size:20px;background:rgba(255,90,79,.55)}
#bJump,#bAct{width:66px;height:66px}
#bAct{background:rgba(70,224,122,.65);font-size:15px}
#carL button{width:84px;height:84px;font-size:30px;border-radius:22px}
.tall{width:80px;height:120px;border-radius:22px!important;background:rgba(70,224,122,.55)!important}
.mid{width:72px;height:80px;border-radius:20px!important;background:rgba(255,90,79,.5)!important}
.sm{width:62px;height:62px;font-size:14px!important}
#bSell{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);pointer-events:auto;background:var(--cash);color:#0b2a16;font-size:24px;padding:12px 26px;border-radius:18px;box-shadow:0 6px 0 #1f8a45,0 10px 20px rgba(0,0,0,.3)}

/* store sheets */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,12,24,.55);padding:12px}
.sheet{width:min(400px,92vw);max-height:90vh;overflow:auto;background:var(--card);border:6px solid #2a3350;border-radius:28px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.sheet h2{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:24px;text-align:center}
.sheet .sub{margin:0 0 12px;text-align:center;font-size:12px;opacity:.7}
.close{margin-top:14px;width:100%;padding:12px;border-radius:16px;background:#2f3a5c;font-size:18px}
.row{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.row .sw{width:34px;height:34px;border-radius:10px;flex:none;border:2px solid rgba(255,255,255,.3)}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-family:var(--display);font-weight:400;font-size:17px}
.row p{margin:2px 0 0;font-size:12px;opacity:.75;line-height:1.35}
.row button{padding:9px 12px;border-radius:12px;background:var(--cash);color:#0b2a16;font-size:15px;white-space:nowrap}
.row button.own{background:#2f3a5c;color:var(--paper)}

/* smartphone */
#phone{position:fixed;inset:0;z-index:20;display:block;background:linear-gradient(90deg,rgba(6,10,20,0) 40%,rgba(6,10,20,.35))}
#phone .device{position:absolute;right:calc(env(safe-area-inset-right,0px) + 4vw);bottom:calc(env(safe-area-inset-bottom,0px) - 10px);transform-origin:80% 100%;transform:rotate(-3deg);animation:phUp .38s cubic-bezier(.2,.9,.3,1.1)}
@keyframes phUp{from{transform:translateY(105%) rotate(6deg)}to{transform:rotate(-3deg)}}
#bPhone{min-width:0;width:52px;height:52px;padding:0;display:grid;place-items:center;border-radius:16px}
#bPhone svg{width:30px;height:30px}
#bPhone small{display:none}
.device{position:relative;background:#0a0a0d;border-radius:46px;padding:10px;box-shadow:0 0 0 2px #4a4a55,0 0 0 5px #17171d,0 30px 70px rgba(0,0,0,.65);animation:phIn .32s cubic-bezier(.2,.9,.3,1.15)}
.device.land{border-radius:40px}
@keyframes phIn{from{transform:translateY(40%) scale(.9);opacity:0}to{transform:none;opacity:1}}
.device:before,.device:after{content:"";position:absolute;background:#2a2a33;border-radius:3px}
.device.port:before{left:-7px;top:22%;width:4px;height:9%}.device.port:after{right:-7px;top:28%;width:4px;height:13%}
.device.land:before{top:-7px;left:22%;height:4px;width:9%}.device.land:after{bottom:-7px;left:28%;height:4px;width:13%}
.screen{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 80% at 0% 0%,#ff8a5c 0%,rgba(255,138,92,0) 55%),radial-gradient(90% 90% at 100% 100%,#6d5cf7 0%,rgba(109,92,247,0) 60%),linear-gradient(160deg,#24205a,#0e1530)}
.device.land .screen{border-radius:31px}
.island{position:absolute;z-index:5;background:#000;border-radius:16px}
.device.port .island{top:9px;left:50%;transform:translateX(-50%);width:30%;height:24px}
.device.land .island{left:9px;top:50%;transform:translateY(-50%);height:30%;width:24px}
.sbar{position:absolute;z-index:4;top:0;left:0;right:0;height:38px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0;font:800 14px var(--body)}
.device.land .sbar{padding-left:48px;height:30px}
.sbar .r{display:flex;gap:6px;align-items:center;font-size:12px}
.batt{width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative;padding:1px}.batt i{display:block;height:100%;width:78%;background:#fff;border-radius:1px}
.sig{display:flex;gap:1.5px;align-items:flex-end;height:10px}.sig i{width:3px;background:#fff;border-radius:1px}
.pscreen{position:absolute;inset:0;padding:42px 14px 26px;display:flex;flex-direction:column;gap:10px}
.device.land .pscreen{padding:32px 18px 22px 50px}
.widget{background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.widget .t{font:400 34px var(--display);line-height:1;font-variant-numeric:tabular-nums}
.widget .d{font-size:11px;font-weight:800;opacity:.85;letter-spacing:.5px;text-transform:uppercase}
.widget .bal{text-align:right;font-weight:800;font-size:12px}.widget .bal b{display:block;font:400 22px var(--display);color:#7dffa9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:12px 6px;align-content:start;flex:1;overflow:auto}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;padding:0;font:700 11px var(--body);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.ico svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock{display:flex;justify-content:space-around;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:26px;padding:8px 6px}
.dock .app span:last-child{display:none}
.homebar{position:absolute;z-index:6;bottom:7px;left:50%;transform:translateX(-50%);width:34%;height:5px;border-radius:3px;background:rgba(255,255,255,.9);cursor:pointer}
.homebar:after{content:"";position:absolute;inset:-14px -10px}
.appv{position:absolute;inset:0;background:var(--ios-bg);color:var(--ios-ink);padding:40px 0 22px;display:flex;flex-direction:column;animation:appIn .22s ease-out}
.device.land .appv{padding:30px 0 20px 40px}
@keyframes appIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.appv~.homebar{background:#111}
.screen.appopen .sbar{color:#111}.screen.appopen .batt{border-color:#111}.screen.appopen .batt i,.screen.appopen .sig i{background:#111}
.ahead{display:flex;align-items:center;gap:6px;padding:4px 12px 8px}
.ahead button{background:none;color:var(--ios-blue);font:800 15px var(--body);padding:4px 6px}
.ahead h3{margin:0;font:800 20px var(--body);flex:1}
.abody{flex:1;overflow:auto;padding:0 12px 10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.list{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ios-line)}
.li:last-child{border-bottom:0}
.li .lic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font:400 15px var(--display);color:#fff;flex:none}
.li .tx{flex:1;min-width:0}.li b{display:block;font:800 14px var(--body)}.li p{margin:1px 0 0;font-size:12px;color:var(--ios-sub);line-height:1.3}
.li button{background:var(--ios-blue);color:#fff;font:800 13px var(--body);padding:7px 12px;border-radius:999px;white-space:nowrap}
.li button.gray{background:#e5e5ea;color:var(--ios-ink)}
.li button[disabled]{opacity:.4}
.cap{font:800 11px var(--body);color:var(--ios-sub);text-transform:uppercase;letter-spacing:.8px;margin:6px 4px}
.mapapp{display:flex;gap:10px;height:100%}
.mapapp canvas{height:100%;aspect-ratio:1;max-width:62%;border-radius:14px;background:#2aa8dc;display:block;touch-action:none}
.device.port .mapapp{flex-direction:column}.device.port .mapapp canvas{width:100%;height:auto;max-width:none}
.legend{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;gap:4px;touch-action:pan-y}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:6px 8px;font:800 12px var(--body);color:var(--ios-ink);text-align:left}
.chip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:400 11px var(--display);color:#0b1020;font-style:normal;flex:none;border:1.5px solid #0b1020}
.chip.on{outline:2px solid var(--gps)}
.seg{display:flex;background:#e5e5ea;border-radius:9px;padding:2px}.seg button{flex:1;background:none;color:var(--ios-ink);font:800 12px var(--body);padding:6px 8px;border-radius:7px}.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}

#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;background:linear-gradient(180deg,rgba(16,24,43,.05),rgba(16,24,43,.55))}
#start h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(44px,9vw,92px);line-height:.9;color:var(--sun);transform:rotate(-3deg);text-wrap:balance;
  text-shadow:0 5px 0 #c2410c,0 9px 0 #0b1020,4px 0 0 #0b1020,-4px 0 0 #0b1020,0 -4px 0 #0b1020,0 14px 24px rgba(0,0,0,.4)}
#start h1 span{color:#fff;display:block;font-size:.55em;letter-spacing:4px;margin-bottom:6px}
#start .tag{font-weight:800;font-size:15px;background:var(--panel);padding:6px 14px;border-radius:20px}
#play{font-size:32px;padding:14px 56px;border-radius:22px;background:var(--cash);color:#0b2a16;box-shadow:0 7px 0 #1f8a45,0 12px 24px rgba(0,0,0,.35);margin-top:6px}
#play:active{transform:translateY(4px);box-shadow:0 3px 0 #1f8a45}
#keys{font-size:12.5px;line-height:1.6;background:var(--panel);padding:8px 14px;border-radius:14px;max-width:640px}
#keys b{color:var(--sun)}
#ko{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(120,20,20,.35);font-family:var(--display);font-size:clamp(44px,10vw,96px);color:var(--alert)}
#rotate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:var(--ink)}
#rotate .ph{width:60px;height:100px;border:5px solid #fff;border-radius:14px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate p{margin:0;font-size:18px;font-weight:800}
#rotate button{background:none;color:var(--sun);font-family:var(--body);font-weight:800;text-decoration:underline;font-size:14px}
@media (prefers-reduced-motion:reduce){#stars span.on,#rotate .ph,.device,.appv{animation:none}}
@media (max-height:420px){#mini{width:104px;height:104px}#money{font-size:22px}.bar{width:110px}#mission{top:calc(env(safe-area-inset-top,0px) + 52px)}.ico{width:46px;height:46px;border-radius:13px}.ico svg{width:24px;height:24px}.grid{grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px 4px}.widget .t{font-size:26px}}
</style>

<canvas id="c"></canvas><canvas id="cockHud"></canvas>
<div id="vig"></div><div id="hurt"></div>

<div id="hud" hidden>
  <div id="tl">
    <canvas id="mini" width="264" height="264" title="Open map"></canvas>
    <div id="stats" class="outl">
      <div id="money">$0</div>
      <div class="bar"><i id="hpbar"></i></div>
      <div class="bar" id="armorWrap" hidden><i id="arbar"></i></div>

function npcAtNode(n){const I=n.isl;n.ix=(Math.random()*I.sx.length)|0;n.iz=(Math.random()*I.sz.length)|0;n.x=I.sx[n.ix];n.z=I.sz[n.iz];n.pix=n.ix;n.piz=n.iz;nextNode(n);}
function nextNode(n,away){const I=n.isl;const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(d=>[n.ix+d[0],n.iz+d[1]]).filter(([a,b])=>a>=0&&b>=0&&a<I.sx.length&&b<I.sz.length);
 let c=opts.filter(([a,b])=>!(a===n.pix&&b===n.piz));if(!c.length)c=opts;
 let ch;if(away){ch=c.reduce((best,o)=>{const d=Math.hypot(I.sx[o[0]]-away.x,I.sz[o[1]]-away.z);return d>best.d?{o,d}:best;},{o:c[0],d:-1}).o;}else ch=pick(c);
 n.pix=n.ix;n.piz=n.iz;n.ix=ch[0];n.iz=ch[1];n.tx=I.sx[n.ix]+rnd(-.6,.6);n.tz=I.sz[n.iz]+rnd(-.6,.6);}
function spawnNPC(n,farFrom){for(let k=0;k<20;k++){npcAtNode(n);if(!farFrom||Math.hypot(n.x-farFrom.x,n.z-farFrom.z)>70)break;}
 n.state='walk';n.hp=100;n.y=0;n.speed=rnd(1.2,1.8);n.t=0;n.flee=0;n.h=0;n.m.pivot.rotation.set(0,0,0);n.m.root.visible=true;}
for(const isl of ISLANDS)for(let i=0;i<isl.npc;i++){const m=makeHuman(Math.random()<.3?{cap:pick(SHIRT)}:{});scene.add(m.root);const n={m,isl,vel:new THREE.Vector3(),ang:new THREE.Vector3(),p:new THREE.Vector3()};m.root.traverse(o=>o.userData.npc=n);spawnNPC(n);npcs.push(n);}
function knock(n,ix,iy,iz,dmg,byPlayer){
 if(n.state==='walk'||n.state==='flee'||n.state==='getup'){n.p.set(n.x,n.y+1,n.z);n.vel.set(0,0,0);}
 n.hp-=dmg;n.state='rag';n.t=0;n.vel.x+=ix;n.vel.y+=iy;n.vel.z+=iz;n.ang.set(rnd(-8,8),0,rnd(-8,8));
 for(let k=0;k<5;k++)emit(n.p.x,n.p.y+.5,n.p.z,{c:'#ffe066',life:.5,s0:.25,s1:.05,spread:4,g:8,add:true});
 if(byPlayer)crime(n.hp<=0?2:1);
 panicNear(n.p.x,n.p.z,22);}
function panicNear(x,z,r){for(const o of npcs){if(o.state==='walk'&&Math.hypot(o.x-x,o.z-z)<r){o.state='flee';o.flee=rnd(6,10);o.speed=rnd(4.5,6);o.threat={x,z};nextNode(o,o.threat);}}}
function updNPC(n,dt){const m=n.m;if(CITY_MODE&&CITY.ready&&(n.state==='walk'||n.state==='flee')&&Math.hypot(n.x-P.x,n.z-P.z)>200){spawnNPC(n,P);}const dCam=Math.hypot(n.x-camera.position.x,n.z-camera.position.z);m.root.visible=dCam<200;
 if(dCam>320&&(n.state==='walk'))return;
 if(n.state==='walk'||n.state==='flee'){
  if(n.state==='flee'){n.flee-=dt;if(n.flee<=0){n.state='walk';n.speed=rnd(1.2,1.8);}}
  const dx=n.tx-n.x,dz=n.tz-n.z,d=Math.hypot(dx,dz);
  if(d<.4)nextNode(n,n.state==='flee'?n.threat:null);
  else{const s=Math.min(d,n.speed*dt);n.x+=dx/d*s;n.z+=dz/d*s;const th=Math.atan2(dx,dz);n.h+=angDiff(n.h,th)*Math.min(1,10*dt);}
  n.y=groundAt(n.x,n.z);n.t+=dt*n.speed*3.2;
  if(dCam<70){const a=Math.sin(n.t);m.legL.rotation.x=a*.7;m.legR.rotation.x=-a*.7;m.armL.rotation.x=-a*.6;m.armR.rotation.x=a*.6;m.armL.rotation.z=0;m.armR.rotation.z=0;
   if(n.state==='flee'){m.armL.rotation.x=-2.6+a*.4;m.armR.rotation.x=-2.6-a*.4;}}
  m.root.position.set(n.x,n.y,n.z);m.root.rotation.y=n.h;}
 else if(n.state==='rag'){n.t+=dt;n.vel.y-=22*dt;n.p.addScaledVector(n.vel,dt);
  const o={x:n.p.x,z:n.p.z};const hit=collideCircle(o,.5,n.p.y-.5);if(hit){n.p.x=o.x;n.p.z=o.z;const vn=n.vel.x*hit.nx+n.vel.z*hit.nz;if(vn<0){n.vel.x-=1.6*vn*hit.nx;n.vel.z-=1.6*vn*hit.nz;}}
  m.pivot.rotation.x+=n.ang.x*dt;m.pivot.rotation.z+=n.ang.z*dt;
  m.armL.rotation.z=Math.sin(n.t*22)*1.3;m.armR.rotation.z=-Math.sin(n.t*19)*1.3;m.legL.rotation.x=Math.sin(n.t*17)*.9;m.legR.rotation.x=-Math.sin(n.t*15)*.9;
  const g=groundAt(n.p.x,n.p.z);
  if(g<-5){if(n.p.y<-.4&&!n.splashed){n.splashed=true;for(let k=0;k<8;k++)emit(n.p.x,-.3,n.p.z,{c:'#ffffff',life:.8,s0:1,s1:3,spread:2,vy:3,g:6});}if(n.p.y<-4){n.state='dead';n.hp=0;n.t=8;n.splashed=false;}}
  else if(n.p.y<g+.3){n.p.y=g+.3;if(n.vel.y<-3)n.vel.y*=-.35;else n.vel.y=0;n.vel.x*=.72;n.vel.z*=.72;n.ang.multiplyScalar(.6);
   if(n.vel.lengthSq()<.6){n.state=n.hp>0?'down':'dead';n.t=0;n.lie=Math.abs(angDiff(0,m.pivot.rotation.x))<Math.PI/2?Math.PI/2:-Math.PI/2;
    if(n.hp<=0&&Math.random()<.6)dropCash(n.p.x,n.p.z,(rnd(15,60))|0);}}
  m.root.position.set(n.p.x,n.p.y-1,n.p.z);n.x=n.p.x;n.z=n.p.z;}
 else if(n.state==='down'||n.state==='dead'){n.t+=dt;m.pivot.rotation.x=lerp(m.pivot.rotation.x,n.lie||Math.PI/2,Math.min(1,6*dt));m.pivot.rotation.z=lerp(m.pivot.rotation.z,0,Math.min(1,6*dt));
  m.armL.rotation.z=lerp(m.armL.rotation.z,.4,.1);m.armR.rotation.z=lerp(m.armR.rotation.z,-.4,.1);
  const g=groundAt(n.p.x,n.p.z);if(g>-5){n.p.y=lerp(n.p.y,g+.22,.2);}m.root.position.set(n.p.x,n.p.y-1,n.p.z);
  if(n.state==='down'){if(Math.random()<dt*6)emit(n.p.x+rnd(-.3,.3),n.p.y+.6,n.p.z+rnd(-.3,.3),{c:'#ffe066',life:.6,s0:.18,s1:.05,spread:.3,vy:1,add:true});
   if(n.t>3.2){n.state='getup';n.t=0;}}
  else if(n.t>12&&dCam>40)spawnNPC(n,P);}
 else if(n.state==='getup'){n.t+=dt;m.pivot.rotation.x=lerp(m.pivot.rotation.x,0,Math.min(1,8*dt));m.pivot.rotation.z=0;
  n.y=groundAt(n.x,n.z);m.root.position.set(n.x,n.y,n.z);
  if(n.t>.5){m.pivot.rotation.set(0,0,0);n.state='flee';n.flee=8;n.speed=5;n.threat={x:P.x,z:P.z};const I=n.isl;
   let bi=0,bj=0;I.sx.forEach((v,i)=>{if(Math.abs(v-n.x)<Math.abs(I.sx[bi]-n.x))bi=i;});I.sz.forEach((v,j)=>{if(Math.abs(v-n.z)<Math.abs(I.sz[bj]-n.z))bj=j;});
   n.ix=bi;n.iz=bj;n.pix=-1;n.piz=-1;n.tx=I.sx[bi];n.tz=I.sz[bj];if(CITY_MODE)nextNode(n,n.threat);}}}

  if(!air&&c.slip>5&&Math.abs(vf)>11){drift.score+=c.slip*dt*12;drift.t=.9;}else if(drift.score>0){drift.t-=dt;if(drift.t<=0)endDrift(true);}}
 c.vx=fx*vf+fz*vl;c.vz=fz*vf-fx*vl;c.vf=vf;

 else{c.vy-=22*dt;c.y+=c.vy*dt;if(c.y<=gN){if(c.vy<-9){carImpact(c,-c.vy*.5);if(c===P.car)shake=.4;}c.y=gN;c.vy=0;c.climb=0;}}

 if(c.y<-2&&!c.sunk){c.sunk=true;sfx.splash();for(let k=0;k<20;k++)emit(c.x,-.3,c.z,{c:'#e8f8ff',life:1,s0:1,s1:3,spread:3,vy:5,g:9});
  if(c===P.car){exitCar(true);toast('Splash! Vehicle lost at sea');}}
 const target=air?-Math.atan2(c.vy,Math.max(Math.abs(vf),4))*.8:-Math.atan2(c.climb,Math.max(Math.abs(vf),4));
 c.pitch=lerp(c.pitch,target,Math.min(1,8*dt));
 c.m.g.position.set(c.x,c.y,c.z);c.m.g.rotation.y=c.h;c.m.body.rotation.x=c.pitch;
 if(T.bike)c.m.body.rotation.z=lerp(c.m.body.rotation.z,c.mode==='player'||c.mode==='traffic'?c.steer*clamp(Math.abs(vf)/12,0,1)*.5:.3,.15);

let MS=null;
const beaconMat=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.32,depthWrite:false,side:THREE.DoubleSide});
function makeBeacon(color,h=36,r=1.8){const g=new THREE.Group();const cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20,1,true),beaconMat(color));cyl.position.y=h/2;g.add(cyl);
 const ring=new THREE.Mesh(new THREE.RingGeometry(r*1.15,r*1.6,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85}));ring.position.y=.08;g.add(ring);scene.add(g);return g;}
if(CITY_MODE)MISSIONS.length=0;
const startBeacons=MISSIONS.map(m=>{const b=makeBeacon('#ffd23f',26,1.6);b.position.set(m.start.x,0,m.start.z);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:textTex([m.name],512,96,null,'#ffd23f','bold 64px "Lilita One", Arial Black, sans-serif'),transparent:true,depthWrite:false}));s.scale.set(9,1.7,1);s.position.y=5;b.add(s);return b;});
const tBeacon=makeBeacon('#ffd23f',60,2.6);tBeacon.visible=false;
const ringGeo=new THREE.TorusGeometry(6,.6,8,28),ringMat=new THREE.MeshBasicMaterial({color:'#ffd23f'});
const bagGeo=new THREE.BoxGeometry(.9,.9,.6),bagMat=new THREE.MeshLambertMaterial({color:'#c8a24a',emissive:'#5a4210'});
function startMission(def){if(MS)return;closeAll();MS={def,t:def.time,step:0,objs:[],targets:[]};
 const T=MS.targets;
 if(def.type==='deliver'){let p;for(let k=0;k<40;k++){p=randSidewalk(MAIN);if(Math.hypot(p.x-P.x,p.z-P.z)>150)break;}T.push({x:p.x,z:p.z,r:5});MS.text='Drop the pizza at the yellow marker';}
 if(def.type==='race'){RACE.forEach(([x,z])=>T.push({x,z,r:9}));MS.text='Checkpoint 1 of '+T.length;}
 if(def.type==='sell'){let s=pick(parkedSpots.filter(p=>p.isl===MAIN&&Math.hypot(p.x-P.x,p.z-P.z)>60))||{x:-120,z:-120,h:0};
  const c=addCar('sports',s.x,s.z,s.h,'parked','#ff2fa8');c.missionCar=true;MS.car=c;MS.text='Steal the pink Sports car';}
 if(def.type==='collect'){const used=new Set();for(let k=0;k<8;k++){let p;for(let q=0;q<20;q++){p=randSidewalk(PORT);const key=Math.round(p.x/10)+','+Math.round(p.z/10);if(!used.has(key)){used.add(key);break;}}
  const m=new THREE.Mesh(bagGeo,bagMat);m.position.set(p.x,1,p.z);m.castShadow=true;scene.add(m);const b=makeBeacon('#ffd23f',14,.9);b.position.set(p.x,0,p.z);MS.objs.push({m,b,x:p.x,z:p.z});}MS.text='Bags left: 8';}
 if(def.type==='wanted')MS.text='Cause chaos until you have 3 stars';
 if(def.type==='rings'){def.rings.forEach(([x,y,z],i)=>{const nx=def.rings[(i+1)%def.rings.length];const m=new THREE.Mesh(ringGeo,ringMat.clone());m.scale.setScalar(def.rr/6);m.position.set(x,y,z);m.rotation.y=Math.atan2(nx[0]-x,nx[2]-z);scene.add(m);MS.objs.push({m,x,y,z,ring:true});});MS.text='';}
 startBeacons.forEach(b=>b.visible=false);$('mission').hidden=false;$('msName').textContent=def.name;sfx.checkpoint();toast(def.name);}
function endMission(pass,reason){const def=MS.def;
 for(const o of MS.objs){scene.remove(o.m);if(o.b)scene.remove(o.b);}if(MS.car)MS.car.missionCar=false;
 tBeacon.visible=false;$('mission').hidden=true;startBeacons.forEach(b=>b.visible=true);MS=null;
 if(pass){money+=def.reward;addXP(def.reward/3);if(!SAVE.done.includes(def.id))SAVE.done.push(def.id);save();sfx.pass();banner('MISSION PASSED','+$'+def.reward.toLocaleString(),'pass');}
 else{sfx.fail();banner('MISSION FAILED',reason||'','fail');}}
function updMission(dt){if(!MS)return;MS.t-=dt;const def=MS.def,T=MS.targets;const me_=P.plane||P.heli||P.car||P;let target=null;
 if(MS.t<=0){endMission(false,'Out of time');return;}
 if(def.type==='deliver'){target=T[0];if(Math.hypot(me_.x-target.x,me_.z-target.z)<target.r){endMission(true);return;}}
 if(def.type==='race'){target=T[MS.step];if(Math.hypot(me_.x-target.x,me_.z-target.z)<target.r){MS.step++;sfx.checkpoint();if(MS.step>=T.length){endMission(true);return;}target=T[MS.step];MS.text=`Checkpoint ${MS.step+1} of ${T.length}`;MS.t+=3;}}
 if(def.type==='sell'){if(P.car&&P.car.type==='sports'){MS.text='Sell it at the $ garage';target={x:SELL.x,z:SELL.z};}else if(MS.car&&!MS.car.sunk&&MS.car.mode!=='wreck'){target={x:MS.car.x,z:MS.car.z};MS.text='Steal the pink Sports car';}else{endMission(false,'The car was wrecked');return;}}
 if(def.type==='collect'){for(let i=MS.objs.length-1;i>=0;i--){const o=MS.objs[i];o.m.rotation.y+=dt*2;o.m.position.y=1+Math.sin(clock*3+i)*.2;
  if(Math.hypot(me_.x-o.x,me_.z-o.z)<(P.car?2.8:1.6)){scene.remove(o.m);scene.remove(o.b);MS.objs.splice(i,1);sfx.cash();money+=25;}}
  MS.text='Bags left: '+MS.objs.length;if(!MS.objs.length){endMission(true);return;}}
 if(def.type==='wanted'){if(MS.step===0){MS.text=`Cause chaos until you have 3 stars (${stars}/3)`;if(stars>=3){MS.step=1;sfx.checkpoint();}}else{MS.text='Now lose the cops';if(stars===0){endMission(true);return;}}}
 if(def.type==='rings'){const v=def.vehicle==='plane'?P.plane:P.heli;
  if(!v){const list=def.vehicle==='plane'?planes:helis;MS.text=def.vehicle==='plane'?'Get the plane at Sky Harbour airport':'Get a helicopter at a helipad';const hp=list.filter(h=>h.mode==='parked').sort((a,b)=>Math.hypot(a.x-P.x,a.z-P.z)-Math.hypot(b.x-P.x,b.z-P.z))[0];if(hp)target={x:hp.x,z:hp.z};}
  else{const o=MS.objs[MS.step];MS.text=`Ring ${MS.step+1} of ${MS.objs.length}`;target={x:o.x,z:o.z,ring:true};
   MS.objs.forEach((r,i)=>r.m.material.color.set(i===MS.step?'#ffd23f':i<MS.step?'#46e07a':'#ffffff'));
   const dy=v.y+1.6-o.y;if(Math.hypot(v.x-o.x,v.z-o.z)<def.rr+1&&Math.abs(dy)<def.rr+1){MS.step++;sfx.checkpoint();o.m.visible=false;if(MS.step>=MS.objs.length){endMission(true);return;}}}}
 MS.target=target;
 if(target&&!target.ring){tBeacon.visible=true;tBeacon.position.set(target.x,Math.max(0,groundAt(target.x,target.z)),target.z);}else tBeacon.visible=false;
 $('msText').textContent=MS.text;const s=Math.max(0,Math.ceil(MS.t));const el=$('msTime');el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;el.className=s<=10?'low':'';}

function die(){const dx=P.x,dz=P.z;P.dead=true;buzz(300);if(P.car)exitCar(true);if(P.heli)exitHeli();if(P.plane)exitPlane(true);$('ko').hidden=false;sfx.boom();if(MS)endMission(false,'You got knocked out');
 setTimeout(()=>{$('ko').hidden=true;const lost=Math.min(100,money);money-=lost;P.hp=100;P.dead=false;const rs=respawnPoint(dx,dz);P.x=rs.x;P.z=rs.z;P.y=0;P.vy=0;P.yaw=0;P.pitch=0;stars=0;crimeCount=0;save();
  toast(rs.home?`Woke up at ${rs.name}`:(lost?`Hospital bill: -$${lost}`:'Patched up at the hospital'));},2400);}

const K={};const IN={fire:false,jump:false,act:false,left:false,right:false,gas:false,brake:false,hand:false,exit:false,up:false,down:false};
const pressed=new Set();
addEventListener('keydown',e=>{if(e.repeat)return;K[e.code]=true;pressed.add(e.code);if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
 if(e.code==='Escape'&&gameState==='pause')closeAll();});

let mouseDown=false,mouseEdge=false;
canvas.addEventListener('mousedown',e=>{if(gameState!=='play'||isTouch)return;if(document.pointerLockElement!==canvas){try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(err){}return;}mouseDown=true;mouseEdge=true;});
addEventListener('mouseup',()=>mouseDown=false);
addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas&&gameState==='play'){look(e.movementX*.0024,e.movementY*.0024);}});
let camPitchI=0;function look(dx,dy){if(P.car||P.heli||P.plane){camOrbit-=dx*1.2;camOrbitT=1.6;if(P.camMode===2)camPitchI=clamp(camPitchI-dy,-.7,.5);return;}P.yaw-=dx;P.pitch=clamp(P.pitch-dy,-1.35,1.35);}
const touchEl=$('touch'),joyEl=$('joy');let joy=null,lookId=null,lookLast=null;const JV={x:0,y:0};
touchEl.addEventListener('pointerdown',e=>{e.preventDefault();
 if(!P.car&&e.clientX<innerWidth*.42&&joy===null){joy={id:e.pointerId,x:e.clientX,y:e.clientY};joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';joyEl.hidden=false;joyEl.firstChild.style.transform='';}
 else if(lookId===null){lookId=e.pointerId;lookLast={x:e.clientX,y:e.clientY};}
 try{touchEl.setPointerCapture(e.pointerId);}catch(err){}});
touchEl.addEventListener('pointermove',e=>{
 if(joy&&e.pointerId===joy.id){let dx=e.clientX-joy.x,dy=e.clientY-joy.y;const d=Math.hypot(dx,dy),mx=55;if(d>mx){dx*=mx/d;dy*=mx/d;}JV.x=dx/mx;JV.y=dy/mx;joyEl.firstChild.style.transform=`translate(${dx}px,${dy}px)`;}
 else if(e.pointerId===lookId){look((e.clientX-lookLast.x)*.0058,(e.clientY-lookLast.y)*.005);lookLast={x:e.clientX,y:e.clientY};}});
const endTouch=e=>{if(joy&&e.pointerId===joy.id){joy=null;JV.x=JV.y=0;joyEl.hidden=true;}if(e.pointerId===lookId)lookId=null;};
touchEl.addEventListener('pointerup',endTouch);touchEl.addEventListener('pointercancel',endTouch);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();IN[k]=true;b.classList.add('down');try{b.setPointerCapture(e.pointerId);}catch(err){}
  if(k==='act'||k==='exit'||k==='jump')pressed.add('btn_'+k);if(k==='fire')pressed.add('btn_fire');});
 const up=()=>{IN[k]=false;b.classList.remove('down');};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
 b.addEventListener('contextmenu',e=>e.preventDefault());});

const CAM_NAMES=['Chase','Far','Inside'];
function cycleCam(){P.camMode=((P.camMode||0)+1)%3;camPitchI=0;camOrbit=0;sfx.click();setModeUI();toast(CAM_NAMES[P.camMode]+' camera');}
function hideInterior(v){if(v&&v.m.interior)v.m.interior.visible=false;if(v&&v.m.real)v.m.real.visible=true;}
function toggleView(){P.view=P.view==='fp'?'tp':'fp';$('bView').innerHTML=(P.view==='fp'?'1st':'3rd')+'<small>VIEW</small>';}

/* ================= HUD helpers ================= */
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200);}
function banner(t,sub,cls){const el=$('banner');el.className='outl show '+cls;el.innerHTML=t+(sub?`<small>${sub}</small>`:'');clearTimeout(banner.t);banner.t=setTimeout(()=>el.classList.remove('show'),3200);}
function hint(t){const el=$('hint');if(t){if(el.textContent!==t)el.textContent=t;el.classList.add('show');}else el.classList.remove('show');}
function setModeUI(){const mode=P.plane?'plane':P.heli?'heli':P.car?'car':'foot';
 if(isTouch){$('footR').hidden=mode!=='foot';$('carL').hidden=mode!=='car';$('carR').hidden=mode!=='car';$('heliR').hidden=mode!=='heli';$('planeR').hidden=mode!=='plane';}
 $('speedo').hidden=mode==='foot';$('cross').hidden=mode!=='foot';$('bWeapon').hidden=mode!=='foot';
 $('bView').innerHTML=mode==='foot'?(P.view==='fp'?'1st':'3rd')+'<small>VIEW</small>':CAM_NAMES[P.camMode||0]+'<small>CAMERA</small>';
 $('spdLbl').textContent=mode==='heli'?'METRES UP':'MPH';}
if(!isTouch)['footR','carL','carR','heliR','planeR'].forEach(id=>$(id).hidden=true);
let sellPrice=0;
function sellCar(){const c=P.car;if(!c||!sellPrice)return;money+=sellPrice;addXP(25);sfx.sell();toast(`Sold ${c.m.T.name} for $${sellPrice}`);
 const wasSports=c.type==='sports';exitCar(true);scene.remove(c.m.g);cars.splice(cars.indexOf(c),1);P.x=SELL.x;P.z=SELL.z-9;P.yaw=0;save();
 for(let k=0;k<20;k++)emit(SELL.x+rnd(-3,3),1,SELL.z+rnd(-3,3),{c:'#46e07a',life:1,s0:.4,s1:.1,spread:2,vy:5,g:6,add:true});
 if(MS&&MS.def.type==='sell'&&wasSports)endMission(true);}
$('bSell').addEventListener('click',sellCar);
function pay(v){if(money<v){toast(`You need $${v}`);sfx.fail();return false;}money-=v;save();return true;}

 if(kind==='safe'){const own=SAVE.props.includes('safe');T.textContent='Safehouse';S.textContent=bal;

 if(kind==='hospital'){T.textContent='Hospital';S.textContent=`${bal} · health ${Math.round(P.hp)}/100`;
